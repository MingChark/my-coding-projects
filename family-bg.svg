<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee1f9"/>
      <stop offset="1" stop-color="#fdf6e3"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8e063"/>
      <stop offset="1" stop-color="#7cc24f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1350" cy="150" r="80" fill="#ffd93b"/>
  <circle cx="1350" cy="150" r="105" fill="#ffd93b" opacity="0.3"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="300" cy="140" rx="90" ry="35"/>
    <ellipse cx="370" cy="120" rx="70" ry="30"/>
    <ellipse cx="900" cy="90" rx="80" ry="30"/>
    <ellipse cx="960" cy="110" rx="60" ry="25"/>
  </g>

  <!-- Hills -->
  <ellipse cx="400" cy="1050" rx="900" ry="330" fill="url(#hill1)"/>
  <ellipse cx="1400" cy="1100" rx="1000" ry="380" fill="#8fd15f"/>

  <!-- House -->
  <g>
    <rect x="1130" y="560" width="200" height="150" rx="6" fill="#fff3d6"/>
    <polygon points="1110,565 1230,470 1350,565" fill="#e2574c"/>
    <rect x="1200" y="630" width="55" height="80" rx="4" fill="#8d5524"/>
    <rect x="1150" y="590" width="42" height="42" rx="4" fill="#aee1f9" stroke="#ffffff" stroke-width="4"/>
    <rect x="1268" y="590" width="42" height="42" rx="4" fill="#aee1f9" stroke="#ffffff" stroke-width="4"/>
  </g>

  <!-- Tree -->
  <g>
    <rect x="230" y="600" width="30" height="110" rx="10" fill="#8d5524"/>
    <circle cx="245" cy="560" r="75" fill="#5aa843"/>
    <circle cx="195" cy="595" r="50" fill="#6ab84f"/>
    <circle cx="295" cy="595" r="50" fill="#6ab84f"/>
  </g>

  <!-- Family holding hands -->
  <g stroke-linecap="round">
    <!-- Dad -->
    <circle cx="620" cy="620" r="40" fill="#f7c59f"/>
    <path d="M600 596 q20 -26 40 0 l-2 -14 q-18 -14 -36 0 z" fill="#5b4632"/>
    <rect x="585" y="662" width="70" height="120" rx="30" fill="#4a90d9"/>
    <rect x="596" y="778" width="22" height="60" rx="10" fill="#3b5266"/>
    <rect x="626" y="778" width="22" height="60" rx="10" fill="#3b5266"/>
    <!-- Mom -->
    <circle cx="740" cy="630" r="37" fill="#f7c59f"/>
    <path d="M708 640 q-6 -60 32 -64 q38 4 32 64 q-14 -30 -32 -30 q-18 0 -32 30 z" fill="#7a4a21"/>
    <polygon points="740,668 700,790 780,790" fill="#e2574c"/>
    <rect x="718" y="786" width="18" height="52" rx="9" fill="#f7c59f"/>
    <rect x="744" y="786" width="18" height="52" rx="9" fill="#f7c59f"/>
    <!-- Kid (JJ) -->
    <circle cx="845" cy="670" r="30" fill="#f7c59f"/>
    <path d="M828 652 q17 -20 34 0 l-2 -10 q-15 -12 -30 0 z" fill="#3d2f21"/>
    <rect x="820" y="702" width="50" height="80" rx="22" fill="#63c15c"/>
    <rect x="827" y="778" width="16" height="45" rx="8" fill="#3b5266"/>
    <rect x="847" y="778" width="16" height="45" rx="8" fill="#3b5266"/>
    <!-- Arms holding hands -->
    <line x1="655" y1="700" x2="712" y2="710" stroke="#f7c59f" stroke-width="16"/>
    <line x1="770" y1="710" x2="822" y2="726" stroke="#f7c59f" stroke-width="14"/>
    <!-- Dog -->
    <g>
      <ellipse cx="940" cy="790" rx="45" ry="28" fill="#c98a4b"/>
      <circle cx="985" cy="765" r="22" fill="#c98a4b"/>
      <path d="M975 748 l-8 -18 10 4 z" fill="#a06a33"/>
      <path d="M998 748 l8 -18 -10 4 z" fill="#a06a33"/>
      <circle cx="992" cy="762" r="3.5" fill="#33261a"/>
      <path d="M896 782 q-22 -12 -14 -30" stroke="#c98a4b" stroke-width="12" fill="none"/>
      <rect x="915" y="808" width="12" height="26" rx="6" fill="#a06a33"/>
      <rect x="950" y="808" width="12" height="26" rx="6" fill="#a06a33"/>
    </g>
  </g>

  <!-- Flowers -->
  <g>
    <circle cx="420" cy="800" r="10" fill="#ff8fb1"/><circle cx="420" cy="800" r="4" fill="#ffd93b"/>
    <circle cx="480" cy="840" r="10" fill="#c39bd3"/><circle cx="480" cy="840" r="4" fill="#ffd93b"/>
    <circle cx="1080" cy="820" r="10" fill="#ff8fb1"/><circle cx="1080" cy="820" r="4" fill="#ffd93b"/>
    <circle cx="1440" cy="790" r="10" fill="#c39bd3"/><circle cx="1440" cy="790" r="4" fill="#ffd93b"/>
  </g>
</svg>
